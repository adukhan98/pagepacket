<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="41"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.16 0"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="light" cx="56%" cy="50%" r="60%">
      <stop offset="0" stop-color="#dff7e6" stop-opacity="0.98"/>
      <stop offset="0.38" stop-color="#f7f0db" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f4efdf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffbef"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>
  <g opacity="0.13" stroke="#08100a" stroke-width="1">
    <path d="M0 160 H1920"/>
    <path d="M0 318 H1920"/>
    <path d="M0 476 H1920"/>
    <path d="M0 634 H1920"/>
    <path d="M0 792 H1920"/>
    <path d="M0 950 H1920"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-92 734 C174 514 388 674 612 480 C818 302 1004 366 1200 242 C1420 104 1612 164 2038 80" stroke="#048c3d" stroke-width="12" opacity="0.74"/>
    <path d="M-30 856 C220 704 440 782 636 610 C862 412 1046 536 1286 362 C1480 220 1644 260 2006 176" stroke="#fffbef" stroke-width="5" opacity="0.92"/>
    <path d="M146 252 C344 430 528 316 738 474 C934 622 1164 556 1334 708 C1502 858 1708 778 1952 914" stroke="#048c3d" stroke-width="8" opacity="0.42"/>
  </g>
  <g opacity="0.58" fill="#08100a">
    <circle cx="612" cy="480" r="8"/>
    <circle cx="1200" cy="242" r="10"/>
    <circle cx="636" cy="610" r="7"/>
    <circle cx="1286" cy="362" r="9"/>
    <circle cx="1334" cy="708" r="8"/>
  </g>
  <g opacity="0.11" fill="#08100a" font-family="IBM Plex Mono, monospace" font-size="48" font-weight="700">
